[package]
name = "usb-comm"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "HID, serial and Windows USB Print discovery, hotplug and communication"
license = "MIT OR Apache-2.0"

[dependencies]
hidapi = { version = "2.6.7", default-features = false }
serialport = "4.10.1"
tokio-serial = "5.5.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "io-util", "net", "macros"] }
thiserror = "2"
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["linux-native"] }
udev = "0.9"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
io-kit-sys = "0.4"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Pipes"] }

